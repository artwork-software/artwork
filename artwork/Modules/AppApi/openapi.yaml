    AppCommentResponse:
      type: object
      required: [comment]
      properties:
        comment: { $ref: '#/components/schemas/AppComment' }
    AppTask:
      type: object
      required: [id, name, done, deadline]
      properties:
        id: { type: integer }
        name: { type: string }
