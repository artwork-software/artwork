openapi: 3.0.3
info:
  title: Artwork App API
  description: |
    Contract of the artwork app API (`/api/app/v1`), consumed by the artwork app.
    Maintained by hand: the app generates its client from this file and
    `tests/Feature/AppApi/AppContractTest.php` validates every endpoint against it.

    The machine API (`/api/v1`) is documented separately — see `artwork:export-openapi`.

    ## Authentication

    Every customer runs their own instance. The app first finds the user's instance
    with `POST /api/app/v1/auth/discover`, sent to every known instance with only a
    hash of the email; the password then goes to the matching instance alone.

    `POST /api/app/v1/auth/login` issues a Passport personal access token with the `app`
    scope. Every other endpoint expects it as `Authorization: Bearer {token}`; download
    links are signed URLs and need no token.
  version: 1.0.0
  contact:
    name: Artwork Support
servers:
  - url: https://ihre-artwork-domain.de
    description: Artwork instance
security:
  - bearerAuth: []
paths:
  /api/app/v1/auth/discover:
    post:
      tags: [App]
      operationId: appDiscover
      summary: Check whether this instance holds an account for an email hash
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppDiscoverRequest' }
      responses:
        '200':
          description: Whether the email belongs to an account here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDiscoverResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many discovery requests from this IP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/app/v1/auth/login:
    post:
      tags: [App]
      operationId: appLogin
      summary: Log in and receive an app API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppLoginRequest' }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLoginResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Two-factor code required or invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTwoFactorRequiredResponse' }
  /api/app/v1/me:
    get:
      tags: [App]
      operationId: appMe
      summary: The authenticated user
      responses:
        '200':
          description: User payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/app/v1/auth/logout:
    post:
      tags: [App]
      operationId: appLogout
      summary: Revoke the current token
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/app/v1/dashboard:
    get:
      tags: [App]
      operationId: appDashboard
      summary: Home screen payload
      responses:
        '200':
          description: Dashboard blocks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/app/v1/shift-plan:
    get:
      tags: [App]
      operationId: appShiftPlan
      summary: The user's own shift plan for a date range
      parameters:
        - { $ref: '#/components/parameters/RangeStart' }
        - { $ref: '#/components/parameters/RangeEnd' }
      responses:
        '200':
          description: Days with shifts and totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftPlanResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/shift-plan/shifts/{shift}:
    get:
      tags: [App]
      operationId: appShiftPlanShift
      summary: A single shift of the user's own plan (deeplinks)
      parameters:
        - { name: shift, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The shift in the plan-day shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftPlanShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/calendar:
    get:
      tags: [App]
      operationId: appCalendar
      summary: Room occupancy calendar for a date range
      parameters:
        - { $ref: '#/components/parameters/RangeStart' }
        - { $ref: '#/components/parameters/RangeEnd' }
      responses:
        '200':
          description: Days with events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCalendarResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/shift-list:
    get:
      tags: [App]
      operationId: appShiftList
      summary: Dienstplan list view (day → room → shifts) for a date range
      parameters:
        - { $ref: '#/components/parameters/RangeStart' }
        - { $ref: '#/components/parameters/RangeEnd' }
      responses:
        '200':
          description: Days with rooms and staffing counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/inventory/categories:
    get:
      tags: [App]
      operationId: appInventoryCategories
      summary: Inventory categories with their subcategories
      description: Only while `permissions.can_view_inventory`.
      responses:
        '200':
          description: All categories, by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInventoryCategoriesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/app/v1/inventory/articles:
    get:
      tags: [App]
      operationId: appInventoryArticles
      summary: One page of inventory articles, searched and filtered like in the web
      description: >-
        Ordered by category, subcategory and name. `q` searches name, inventory
        number and description; a `*` wildcard also searches property values
        (e.g. a serial number). 30 articles per page.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: category_id, in: query, required: false, schema: { type: integer } }
        - { name: subcategory_id, in: query, required: false, schema: { type: integer } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The page and where it stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInventoryArticlesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/inventory/articles/{article}:
    get:
      tags: [App]
      operationId: appInventoryArticle
      summary: One article with images, stock per status, properties and units
      parameters:
        - { $ref: '#/components/parameters/InventoryArticleId' }
      responses:
        '200':
          description: The article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInventoryArticleResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/inventory/articles/{article}/availability:
    get:
      tags: [App]
      operationId: appInventoryAvailability
      summary: How much of an article is free in a date range
      description: >-
        Ready stock minus the peak of overlapping internal and external material
        issues in the range, as in the web's planning. Whole days, defaulting to
        the current week.
      parameters:
        - { $ref: '#/components/parameters/InventoryArticleId' }
        - { $ref: '#/components/parameters/RangeStart' }
        - { $ref: '#/components/parameters/RangeEnd' }
      responses:
        '200':
          description: Stock in the range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInventoryAvailabilityResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects:
    get:
      tags: [App]
      operationId: appProjects
      summary: Projects the user may view
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppProjectsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/app/v1/projects/{project}:
    get:
      tags: [App]
      operationId: appProject
      summary: Project header (state, team, tabs)
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/projects/{project}/tabs/{projectTab}:
    get:
      tags: [App]
      operationId: appProjectTab
      summary: One tab's component tree with values
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: projectTab, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Tab components
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppProjectTabResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/projects/{project}/tabs/{projectTab}/components/{component}:
    patch:
      tags: [App]
      operationId: appUpdateComponentValue
      summary: Update a custom component's value
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: projectTab, in: path, required: true, schema: { type: integer } }
        - { name: component, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppComponentValueUpdateRequest' }
      responses:
        '200':
          description: Stored value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppComponentValueResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/events:
    post:
      tags: [App]
      operationId: appCreateEvent
      summary: Create an event in the project
      description: >-
        The app books directly (403 without the right to book the room
        directly). Events without a room need the right to create events
        without a room request (403 otherwise).
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppEventRequestBody' }
      responses:
        '201':
          description: Created event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEventResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/events/{event}:
    get:
      tags: [App]
      operationId: appEvent
      summary: One event with the editor's picker options
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: event, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Event with options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEventShowResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [App]
      operationId: appUpdateEvent
      summary: Update an event
      description: >-
        Moving the event to a room the user may not book directly turns it into
        a room request (the room admins are notified), like in the web. Moving
        a date that is on sale in ticketing needs the header
        X-Ticketing-Move-Confirmed after the user confirmed it (422 otherwise).
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: X-Ticketing-Move-Confirmed, in: header, required: false, schema: { type: string } }
        - { name: event, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppEventRequestBody' }
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEventResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/shifts:
    post:
      tags: [App]
      operationId: appCreateShift
      summary: Create a shift in the project
      description: >-
        Shift mutations (create, update, delete, assign and remove workers) are
        limited to crafts the user may plan (shift planner of the craft or craft
        plannable by all); other crafts answer 403 with errors.craft_id.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppShiftRequestBody' }
      responses:
        '201':
          description: Created shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/shifts/{shift}:
    get:
      tags: [App]
      operationId: appShift
      summary: One shift with the editor's picker options
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
      responses:
        '200':
          description: Shift with options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftShowResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [App]
      operationId: appUpdateShift
      summary: Update a shift
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppShiftRequestBody' }
      responses:
        '200':
          description: Updated shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [App]
      operationId: appDeleteShift
      summary: Delete a shift (assignments cascade)
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/projects/{project}/shifts/{shift}/workers:
    get:
      tags: [App]
      operationId: appShiftWorkers
      summary: Assignable workers for the shift's craft
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
        - { $ref: '#/components/parameters/PickerQuery' }
      responses:
        '200':
          description: Candidate workers (max 30 — narrow with q)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWorkersResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [App]
      operationId: appAssignWorker
      summary: Assign a worker to the shift
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppWorkerAssignRequest' }
      responses:
        '201':
          description: Assigned; fresh shift returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Function fully staffed — repeat with overbook=true to confirm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [App]
      operationId: appRemoveWorker
      summary: Remove a worker from the shift
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ShiftId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppWorkerRemoveRequest' }
      responses:
        '200':
          description: Removed; fresh shift returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/comments:
    post:
      tags: [App]
      operationId: appCreateComment
      summary: Add a project comment
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCommentRequest' }
      responses:
        '201':
          description: Created comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCommentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/checklists/{checklist}/tasks:
    post:
      tags: [App]
      operationId: appCreateTask
      summary: Add a task to a checklist
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: checklist, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppTaskRequest' }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/tasks/{task}/done:
    patch:
      tags: [App]
      operationId: appToggleTask
      summary: Toggle a task done/undone
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: task, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/projects/{project}/team/candidates:
    get:
      tags: [App]
      operationId: appTeamCandidates
      summary: Users not yet on the project team
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PickerQuery' }
      responses:
        '200':
          description: Candidates (max 30 — narrow with q)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCandidatesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/app/v1/projects/{project}/team:
    post:
      tags: [App]
      operationId: appAddTeamMember
      summary: Add a user to the project team
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppTeamStoreRequest' }
      responses:
        '201':
          description: Added; full roster returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTeamResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/app/v1/projects/{project}/team/{user}:
    patch:
      tags: [App]
      operationId: appUpdateTeamMember
      summary: Update a team member's rights
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppTeamRightsRequest' }
      responses:
        '200':
          description: Updated; full roster returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTeamResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [App]
      operationId: appRemoveTeamMember
      summary: Remove a user from the project team
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed; full roster returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTeamResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/app/v1/ticketing/dates:
    get:
      tags: [App]
      operationId: appTicketingDates
      summary: Dates released to Artwork-Tickets in a range, with their door counters
      description: >-
        Only for users with `permissions.can_run_ticket_admission`; dates of
        projects the user cannot view are left out.
      parameters:
        - { $ref: '#/components/parameters/RangeStart' }
        - { $ref: '#/components/parameters/RangeEnd' }
      responses:
        '200':
          description: Released dates, ordered by start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTicketingDatesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/ticketing/dates/{event}:
    get:
      tags: [App]
      operationId: appTicketingDate
      summary: One released date with its guest list
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: The date and every ticket of it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTicketingDateResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/ticketing/dates/{event}/check-ins:
    post:
      tags: [App]
      operationId: appTicketingCheckIn
      summary: Check a ticket in, scanned or picked from the guest list
      description: >-
        Send either the scanned `payload` or a `ticket_id`. `scan_id` is minted
        on the device per attempt; a retry with the same id replays the first
        answer instead of admitting twice. A refusal is an outcome, not an error.
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCheckInRequest' }
      responses:
        '200':
          description: The door's decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCheckInResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/ticketing/dates/{event}/check-ins/revert:
    post:
      tags: [App]
      operationId: appTicketingRevertCheckIn
      summary: Take a check-in back
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppRevertCheckInRequest' }
      responses:
        '200':
          description: Reverted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppRevertCheckInResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/ticketing/dates/{event}/passes:
    get:
      tags: [App]
      operationId: appTicketingPasses
      summary: Passes and Abos the door can admit for the date
      description: >-
        Searched by holder or card code (`q`, at least two characters) or
        resolved from a scanned card QR (`payload`). Each card says what keeps
        it out tonight (`block`) or what its holder still pays per category.
      parameters:
        - { $ref: '#/components/parameters/EventId' }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: payload, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Categories of the date and the matching cards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDoorPassesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/ticketing/dates/{event}/pass-admissions:
    post:
      tags: [App]
      operationId: appTicketingAdmitPass
      summary: Let a card holder in — a box-office ticket on the card, checked in
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppPassAdmissionRequest' }
      responses:
        '200':
          description: Admitted; `paid_cents` is what the holder paid at the till
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppPassAdmissionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TicketingError' }
  /api/app/v1/files/{projectFile}:
    get:
      tags: [App]
      operationId: appDownloadFile
      summary: Download a project file via a short-lived signed URL
      description: >-
        Use the URL from the documents payload as is. It is signed for the
        requesting user; the download re-checks that user's file rights
        (403 if they no longer apply, 404 if the stored file is missing).
      security: []
      parameters:
        - { name: projectFile, in: path, required: true, schema: { type: integer } }
        - { name: user, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Personal access token from `/auth/login`, sent as `Bearer {token}`
  responses:
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Sie haben keine Berechtigung, auf diese Ressource zuzugreifen."
    NotFound:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Die angeforderte Ressource wurde nicht gefunden."
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TicketingError:
      description: >-
        Invalid input, or Artwork-Tickets refused or could not be reached;
        `message` says why in the user's language.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
              code:
                type: string
                description: >-
                  Artwork-Tickets' code when it refused, e.g. `ADMISSION_RUNNING`
                  (the first attempt with this id is still running: retry with
                  the same id) or `HOLD_EXPIRED` (the id is spent: start anew).
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  parameters:
    RangeStart:
      name: start
      in: query
      required: false
      description: Y-m-d; defaults to the current week. Max range 62 days.
      schema: { type: string, format: date }
    RangeEnd:
      name: end
      in: query
      required: false
      description: Y-m-d; required with start, must not lie before it.
      schema: { type: string, format: date }
    ProjectId:
      name: project
      in: path
      required: true
      schema: { type: integer }
    ShiftId:
      name: shift
      in: path
      required: true
      schema: { type: integer }
    InventoryArticleId:
      name: article
      in: path
      required: true
      schema: { type: integer }
    EventId:
      name: event
      in: path
      required: true
      schema: { type: integer }
    PickerQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive name filter; responses cap at 30 entries.
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
      required:
        - message
    AppUser:
      type: object
      required: [id, name, email, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        permissions:
          type: object
          required: [can_view_shift_plan, can_run_ticket_admission, can_view_inventory]
          properties:
            can_view_shift_plan: { type: boolean }
            can_run_ticket_admission:
              type: boolean
              description: The house is connected to Artwork-Tickets and the user may run its door.
            can_view_inventory:
              type: boolean
              description: The inventory module is on (or the user is an admin) and the user may view the inventory.
    AppDiscoverRequest:
      type: object
      required: [email_hash]
      properties:
        email_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Lower-case hex SHA-256 of the email, trimmed and lower-cased before hashing.
            Example: `" Max.Mustermann@Example.de "` hashes as `max.mustermann@example.de`
            to `3b128ad4c64aa69af51af3b20b35d7e336ac6046bee10c6130cada27545d3e4a`.
    AppDiscoverResponse:
      type: object
      required: [known, name]
      properties:
        known: { type: boolean }
        name: { type: string, description: 'Display name of the instance, shown when several instances match' }
    AppLoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_name: { type: string, maxLength: 255 }
        code: { type: string, nullable: true, description: TOTP code when 2FA is enabled }
        recovery_code: { type: string, nullable: true }
    AppLoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/AppUser' }
    AppTwoFactorRequiredResponse:
      type: object
      required: [message, two_factor_required]
      properties:
        message: { type: string }
        two_factor_required: { type: boolean }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    AppMeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AppUser' }
    AppInventoryCategory:
      type: object
      required: [id, name, subcategories]
      properties:
        id: { type: integer }
        name: { type: string }
        subcategories:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
    AppInventoryCategoriesResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/AppInventoryCategory' }
    AppInventoryArticleSummary:
      type: object
      required:
        - id
        - name
        - inventory_number
        - category
        - subcategory
        - thumbnail_url
        - room
        - is_detailed_quantity
        - ready_quantity
        - total_quantity
      properties:
        id: { type: integer }
        name: { type: string }
        inventory_number: { type: string }
        category:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        subcategory:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        thumbnail_url: { type: string, nullable: true }
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
          description: Where the article is kept.
        is_detailed_quantity:
          type: boolean
          description: The stock consists of numbered units (see `units` on the article).
        ready_quantity:
          type: number
          description: Stock in the ready status — the only stock that counts as available.
        total_quantity: { type: number }
    AppInventoryArticlesResponse:
      type: object
      required: [articles, meta]
      properties:
        articles:
          type: array
          items: { $ref: '#/components/schemas/AppInventoryArticleSummary' }
        meta:
          type: object
          required: [current_page, last_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    AppInventoryStatusRef:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string, nullable: true }
    AppInventoryStatusStock:
      allOf:
        - { $ref: '#/components/schemas/AppInventoryStatusRef' }
        - type: object
          required: [quantity, ready]
          properties:
            quantity: { type: number }
            ready:
              type: boolean
              description: The ready status; its stock is what counts as available.
    AppInventoryProperty:
      type: object
      required: [id, name, type, value]
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          description: >-
            The property type as configured (text, date, checkbox, select, number,
            year, manufacturer, …). A checkbox is "1" or "0", a date Y-m-d, a
            manufacturer its name. Empty and file properties are left out.
        value: { type: string }
    AppInventoryUnit:
      type: object
      required: [id, inventory_number, name, quantity, status, room, properties]
      properties:
        id: { type: integer }
        inventory_number: { type: string, description: e.g. 00042-001 }
        name: { type: string, nullable: true }
        quantity: { type: number }
        status:
          anyOf: [{ $ref: '#/components/schemas/AppInventoryStatusRef' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        properties:
          type: array
          items: { $ref: '#/components/schemas/AppInventoryProperty' }
    AppInventoryImage:
      type: object
      required: [id, url, thumbnail_url]
      properties:
        id: { type: integer }
        url: { type: string }
        thumbnail_url: { type: string, nullable: true }
    AppInventoryArticle:
      allOf:
        - { $ref: '#/components/schemas/AppInventoryArticleSummary' }
        - type: object
          required: [description, images, statuses, properties, units]
          properties:
            description: { type: string, nullable: true }
            images:
              type: array
              description: The main image first.
              items: { $ref: '#/components/schemas/AppInventoryImage' }
            statuses:
              type: array
              description: Stock per status, in the configured order. Empty for articles kept without statuses.
              items: { $ref: '#/components/schemas/AppInventoryStatusStock' }
            properties:
              type: array
              items: { $ref: '#/components/schemas/AppInventoryProperty' }
            units:
              type: array
              description: The numbered units; empty unless `is_detailed_quantity`.
              items: { $ref: '#/components/schemas/AppInventoryUnit' }
    AppInventoryArticleResponse:
      type: object
      required: [article]
      properties:
        article: { $ref: '#/components/schemas/AppInventoryArticle' }
    AppInventoryAvailabilityResponse:
      type: object
      required: [start, end, available, reserved, total]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        available: { type: number }
        reserved:
          type: number
          description: Peak quantity booked by overlapping material issues in the range.
        total:
          type: number
          description: Ready stock.
    AppIdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    AppCraft:
      type: object
      required: [id, name, abbreviation, color]
      properties:
        id: { type: integer }
        name: { type: string }
        abbreviation: { type: string }
        color: { type: string }
    AppEventType:
      type: object
      required: [id, name, abbreviation, hex_code]
      properties:
        id: { type: integer }
        name: { type: string }
        abbreviation: { type: string }
        hex_code: { type: string }
    AppColorHoliday:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string, nullable: true }
    AppColleague:
      type: object
      required: [id, type, name]
      properties:
        id: { type: integer }
        type: { type: string, enum: [user, freelancer, service_provider] }
        name: { type: string }
    AppPlanShift:
      type: object
      required: [id, name, start, end, break_minutes, description, is_committed, in_workflow, planned_working_hours, craft, event, project, room, colleagues]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        start: { type: string, example: '18:00' }
        end: { type: string, example: '23:00' }
        break_minutes: { type: integer }
        description: { type: string, nullable: true }
        is_committed: { type: boolean }
        in_workflow: { type: boolean }
        planned_working_hours: { type: string, example: '04:30', description: Always zero-padded HH:mm }
        craft:
          anyOf: [{ $ref: '#/components/schemas/AppCraft' }]
          nullable: true
        event:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        project:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        colleagues:
          type: array
          items: { $ref: '#/components/schemas/AppColleague' }
    AppIndividualTime:
      type: object
      required: [id, title, start_time, end_time, full_day]
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        start_time: { type: string, nullable: true }
        end_time: { type: string, nullable: true }
        full_day: { type: boolean }
    AppDayService:
      type: object
      required: [id, name, icon, hex_color]
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string, nullable: true }
        hex_color: { type: string, nullable: true }
    AppDayComment:
      type: object
      required: [id, comment, date]
      properties:
        id: { type: integer }
        comment: { type: string, nullable: true }
        date: { type: string, nullable: true }
    AppShiftPlanDay:
      type: object
      required: [date, total_work_time, total_break_time, shifts, individual_times, day_services, holidays, comments]
      properties:
        date: { type: string, format: date }
        total_work_time: { type: string, example: '07:30', description: Always zero-padded HH:mm }
        total_break_time: { type: string, example: '00:30' }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/AppPlanShift' }
        individual_times:
          type: array
          items: { $ref: '#/components/schemas/AppIndividualTime' }
        day_services:
          type: array
          items: { $ref: '#/components/schemas/AppDayService' }
        holidays:
          type: array
          items:
            type: object
            required: [name]
            properties:
              id: { type: integer, nullable: true }
              name: { type: string }
        comments:
          type: array
          items: { $ref: '#/components/schemas/AppDayComment' }
    AppShiftPlanTotals:
      type: object
      required: [work_time, shift_count]
      properties:
        work_time: { type: string, example: '32:00' }
        shift_count: { type: integer }
    AppShiftPlanResponse:
      type: object
      required: [start, end, days, totals]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/AppShiftPlanDay' }
        totals: { $ref: '#/components/schemas/AppShiftPlanTotals' }
    AppShiftPlanShiftResponse:
      type: object
      required: [date, shift]
      properties:
        date: { type: string, format: date }
        shift: { $ref: '#/components/schemas/AppPlanShift' }
    AppDashboardEvent:
      type: object
      required: [id, name, start_time, end_time, event_type, project, room]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        start_time: { type: string, nullable: true }
        end_time: { type: string, nullable: true }
        event_type:
          anyOf: [{ $ref: '#/components/schemas/AppEventType' }]
          nullable: true
        project:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
    AppDashboardTask:
      type: object
      required: [id, name, description, deadline, checklist_name, project_name]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        deadline: { type: string, nullable: true }
        checklist_name: { type: string, nullable: true }
        project_name: { type: string, nullable: true }
    AppTimelineRow:
      type: object
      required: [type, shift, event]
      properties:
        type: { type: string, enum: [shift, event] }
        shift:
          anyOf: [{ $ref: '#/components/schemas/AppPlanShift' }]
          nullable: true
        event:
          anyOf: [{ $ref: '#/components/schemas/AppDashboardEvent' }]
          nullable: true
    AppDashboardResponse:
      type: object
      required: [date, today, events_today, timeline, tasks, unread_notifications]
      properties:
        date: { type: string, format: date }
        today: { $ref: '#/components/schemas/AppShiftPlanDay' }
        events_today:
          type: array
          items: { $ref: '#/components/schemas/AppDashboardEvent' }
        next_shift:
          anyOf: [{ $ref: '#/components/schemas/AppPlanShift' }]
          nullable: true
        timeline:
          type: array
          items: { $ref: '#/components/schemas/AppTimelineRow' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/AppDashboardTask' }
        unread_notifications: { type: integer }
    AppCalendarEvent:
      type: object
      required: [id, name, description, start, end, all_day, event_type, project, room, status_color]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        event_type:
          anyOf: [{ $ref: '#/components/schemas/AppEventType' }]
          nullable: true
        project:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        status_color: { type: string, nullable: true }
    AppCalendarDay:
      type: object
      required: [date, holidays, events]
      properties:
        date: { type: string, format: date }
        holidays:
          type: array
          items: { $ref: '#/components/schemas/AppColorHoliday' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AppCalendarEvent' }
    AppCalendarResponse:
      type: object
      required: [start, end, days]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/AppCalendarDay' }
    AppListWorker:
      type: object
      required: [id, type, name, is_unavailable]
      properties:
        id: { type: integer }
        type: { type: string, enum: [user, freelancer, service_provider] }
        name: { type: string }
        is_unavailable: { type: boolean }
    AppListShift:
      type: object
      required: [id, start, end, break_minutes, description, is_committed, in_workflow, craft, project, required_count, assigned_count, open_count, workers]
      properties:
        id: { type: integer }
        start: { type: string }
        end: { type: string }
        break_minutes: { type: integer }
        description: { type: string, nullable: true }
        is_committed: { type: boolean }
        in_workflow: { type: boolean }
        craft:
          anyOf: [{ $ref: '#/components/schemas/AppCraft' }]
          nullable: true
        project:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
