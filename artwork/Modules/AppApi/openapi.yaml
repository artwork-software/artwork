      properties:
        worker_id: { type: integer }
        worker_type: { type: string, enum: [user, freelancer, service_provider] }
        shift_qualification_id: { type: integer }
        overbook: { type: boolean, description: Explicit confirmation to overbook a full function }
    AppWorkerRemoveRequest:
      type: object
