        - { $ref: '#/components/schemas/AppTeamRightsRequest' }
    AppTeamResponse:
      type: object
      required: [team]
      properties:
        team:
          type: array
          items: { $ref: '#/components/schemas/AppTeamMember' }
    AppChecklist:
      type: object
      required: [id, name, private, can_edit, tasks]
      properties:
        id: { type: integer }
        name: { type: string }
        private: { type: boolean }
        can_edit: { type: boolean }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/AppTask' }
    AppFile:
      type: object
      required: [id, name, created_at, url]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, nullable: true }
