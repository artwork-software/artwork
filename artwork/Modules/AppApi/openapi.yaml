        days:
          type: array
          items:
            type: object
            required: [date, shifts]
            properties:
              date: { type: string, format: date }
              shifts:
                type: array
                items: { $ref: '#/components/schemas/AppProjectShift' }
        overbooking_allowed: { type: boolean }
        crafts:
          type: array
          items: { $ref: '#/components/schemas/AppCraft' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
        shift_qualifications:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
    AppChecklistTabValue:
      type: object
      required: [checklists]
      properties:
        checklists:
          type: array
          items: { $ref: '#/components/schemas/AppChecklist' }
    AppCommentTabValue:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/AppComment' }
    AppFilesValue:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/AppFile' }
    AppAttributesValue:
      type: object
      required: [categories, genres, sectors]
      properties:
        categories: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        sectors: { type: array, items: { type: string } }
    AppPeriodValue:
      type: object
      required: [first, last]
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
    AppNamesValue:
      type: object
      required: [names]
      properties:
        names: { type: array, items: { type: string } }
    AppTextValue:
      type: object
      required: [text]
      properties:
        text: { type: string, nullable: true, description: Plain text }
    AppBudgetDeadlineValue:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date, nullable: true }
    AppBudgetInfoValue:
      type: object
      required: [cost_center, description, gema]
      properties:
        cost_center: { type: string, nullable: true }
        description: { type: string, nullable: true }
        gema: { type: boolean }
    AppTicketingDate:
      type: object
      required: [event_id, name, project, room, start, end, cancelled, capacity, sold, checked_in]
      properties:
        event_id: { type: integer }
        name: { type: string, nullable: true, description: "The event's own name, if it has one" }
        project: { $ref: '#/components/schemas/AppIdName' }
        room: { type: string, nullable: true }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, nullable: true }
        cancelled: { type: boolean }
        capacity: { type: integer }
        sold: { type: integer }
        checked_in: { type: integer }
    AppTicketingDatesResponse:
      type: object
      required: [start, end, dates]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        dates:
          type: array
          items: { $ref: '#/components/schemas/AppTicketingDate' }
    AppTicketSeat:
      type: object
      required: [section, row, number]
      description: All three null on a date without a seating plan.
      properties:
        section: { type: string, nullable: true }
        row: { type: string, nullable: true }
        number: { type: string, nullable: true }
    AppDoorTicket:
      type: object
      required: [id, code, status, holder_name, email, category_name, reduction_name, requires_proof, seat, checked_in_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [valid, cancelled, refunded] }
        holder_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        category_name: { type: string }
        reduction_name: { type: string, nullable: true }
        requires_proof: { type: boolean, description: The reduction wants a proof shown at the door }
        seat: { $ref: '#/components/schemas/AppTicketSeat' }
        checked_in_at: { type: string, format: date-time, nullable: true }
    AppTicketingDateDetail:
      allOf:
        - { $ref: '#/components/schemas/AppTicketingDate' }
        - type: object
          required: [doors_at, ticket_count, tickets]
          properties:
            doors_at: { type: string, format: date-time, nullable: true }
            ticket_count: { type: integer, description: "Valid tickets of the date, all of them even when the guest list stops at 1000" }
            tickets:
              type: array
              description: The guest list, at most 1000 tickets; ticket_count is the real total.
              items: { $ref: '#/components/schemas/AppDoorTicket' }
    AppTicketingDateResponse:
      type: object
      required: [date]
      properties:
        date: { $ref: '#/components/schemas/AppTicketingDateDetail' }
    AppCheckInRequest:
      type: object
      required: [scan_id]
      properties:
        scan_id: { type: string, format: uuid }
        payload: { type: string, maxLength: 512, description: 'The scanned QR, as read' }
        ticket_id: { type: string, format: uuid, description: A ticket picked from the guest list }
    AppCheckedTicket:
      type: object
      required: [id, code, holder_name, category_name, requires_proof, seat, checked_in_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        holder_name: { type: string, nullable: true }
        category_name: { type: string }
        requires_proof: { type: boolean }
        seat: { $ref: '#/components/schemas/AppTicketSeat' }
        checked_in_at: { type: string, format: date-time, nullable: true }
    AppCheckInResponse:
      type: object
      required: [scan_id, outcome, ticket]
      properties:
        scan_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [accepted, already_checked_in, wrong_event_date, cancelled, refunded, unknown]
        ticket:
          anyOf: [{ $ref: '#/components/schemas/AppCheckedTicket' }]
          nullable: true
    AppRevertCheckInRequest:
      type: object
      required: [ticket_id]
      properties:
        ticket_id: { type: string, format: uuid }
    AppRevertCheckInResponse:
      type: object
      required: [reverted]
      properties:
        reverted: { type: boolean }
    AppDoorCategory:
      type: object
      required: [id, name, price_cents, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price_cents: { type: integer }
        available: { type: integer, description: Places left in the category tonight }
    AppDoorPass:
      type: object
      required: [id, code, name, holder_name, holder_email, subscription, uses_left, valid_until, block, to_pay]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        holder_name: { type: string }
        holder_email: { type: string }
        subscription: { type: boolean, description: The card behind an Abo }
        uses_left: { type: integer }
        valid_until: { type: string, format: date-time, nullable: true }
        block:
          type: string
          nullable: true
          enum: [inactive, expired, exhausted, notForEvent, notAtDoor, null]
          description: Why the card cannot be used tonight; null when it can
        to_pay:
          type: array
          description: What the holder still pays per category after one use
          items:
            type: object
            required: [price_category_id, cents]
            properties:
              price_category_id: { type: string, format: uuid }
              cents: { type: integer }
    AppDoorPassesResponse:
      type: object
      required: [seated, categories, passes]
      properties:
        seated: { type: boolean, description: Seated dates admit card holders in Artwork-Tickets only }
        categories:
          type: array
          items: { $ref: '#/components/schemas/AppDoorCategory' }
        passes:
          type: array
          items: { $ref: '#/components/schemas/AppDoorPass' }
    AppPassAdmissionRequest:
      type: object
      required: [admission_id, pass_id, price_category_id]
      properties:
        admission_id:
          type: string
          format: uuid
          description: >-
            Minted by the app once per admission and sent again on a retry, so a
            retry answers with the first admission instead of using the pass twice.
        pass_id: { type: string, format: uuid }
        price_category_id: { type: string, format: uuid }
    AppPassAdmissionResponse:
      type: object
      required: [order_number, ticket_code, paid_cents, checked_in_at]
      properties:
        order_number: { type: string }
        ticket_code: { type: string }
        paid_cents: { type: integer }
        checked_in_at: { type: string, format: date-time, nullable: true }
