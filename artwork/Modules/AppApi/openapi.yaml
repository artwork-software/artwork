        id: { type: integer }
        name: { type: string }
        is_manager: { type: boolean }
        can_write: { type: boolean }
        access_budget: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/AppRole' }
    AppProjectDetail:
      type: object
      required: [id, name, is_group, artists, state, team, can_edit_team, project_roles, tabs]
      properties:
        id: { type: integer }
        name: { type: string }
        is_group: { type: boolean }
        artists: { type: string, nullable: true }
        state:
          anyOf: [{ $ref: '#/components/schemas/AppProjectState' }]
          nullable: true
        team:
          type: array
          items: { $ref: '#/components/schemas/AppTeamMember' }
        can_edit_team: { type: boolean }
        project_roles:
          type: array
          items: { $ref: '#/components/schemas/AppRole' }
        tabs:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
    AppProjectResponse:
      type: object
      required: [project]
      properties:
        project: { $ref: '#/components/schemas/AppProjectDetail' }
    AppTabComponentChild:
      type: object
      required: [component_id, type, name, data, value, is_writable]
      properties:
        component_id: { type: integer }
        type:
          type: string
          description: >-
            Kebab-case domain name. Custom: title, text-field, text-area, link,
            checkbox, dropdown, link-list, separator, disclosure. System:
            project-title, project-state, project-team, project-attributes,
            project-period, shift-information, shift-contacts, budget-deadline,
            budget-information, calendar, shifts, checklist, checklist-all,
            comments, comments-all, documents, documents-all.
        name: { type: string, nullable: true }
        data:
          type: object
          nullable: true
          additionalProperties: true
        value:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Custom components carry the stored value ('text' keys are plain
            text). System components carry a server-built payload — see the
            App*Value schemas for the shape per type.
        is_writable: { type: boolean }
    AppTabComponent:
      allOf:
        - { $ref: '#/components/schemas/AppTabComponentChild' }
        - type: object
          required: [note, children]
          properties:
            note: { type: string, nullable: true }
            children:
              type: array
              items: { $ref: '#/components/schemas/AppTabComponentChild' }
    AppProjectTabResponse:
      type: object
      required: [tab, components]
      properties:
        tab: { $ref: '#/components/schemas/AppIdName' }
        components:
          type: array
          items: { $ref: '#/components/schemas/AppTabComponent' }
    AppComponentValueUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          description: Plain text in 'text' keys — the server owns the storage format.
    AppComponentValueResponse:
      type: object
      required: [component_id]
      properties:
        component_id: { type: integer }
        value:
          type: object
          nullable: true
          additionalProperties: true
    AppEvent:
      type: object
      required: [id, name, start, end, all_day, event_type, room, status_color, can_edit]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        event_type:
          anyOf: [{ $ref: '#/components/schemas/AppEventType' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        status_color: { type: string, nullable: true }
        can_edit: { type: boolean }
    AppEventRequestBody:
      type: object
      required: [start, end, all_day, event_type_id]
      properties:
        name: { type: string, nullable: true, maxLength: 255 }
        start: { type: string }
        end: { type: string }
        all_day: { type: boolean }
        room_id: { type: integer, nullable: true }
        event_type_id: { type: integer }
    AppEventResponse:
      type: object
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/AppEvent' }
    AppEventShowResponse:
      type: object
      required: [event, ticketing_on_sale, rooms, event_types]
      properties:
        event: { $ref: '#/components/schemas/AppEvent' }
        ticketing_on_sale:
          type: boolean
          description: >-
            The date is on sale in Artwork-Tickets; moving it needs the
            user's confirmation (X-Ticketing-Move-Confirmed on the update).
        rooms:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
        event_types:
          type: array
          items: { $ref: '#/components/schemas/AppEventType' }
    AppShiftWorker:
      type: object
      required: [id, type, name, qualification_id, is_overbooked]
      properties:
        id: { type: integer }
        type: { type: string, enum: [user, freelancer, service_provider] }
        name: { type: string }
        qualification_id: { type: integer, nullable: true }
        is_overbooked: { type: boolean }
    AppQualificationSlot:
      type: object
      required: [id, name, required, assigned, overbooked]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        required: { type: integer }
        assigned: { type: integer, description: Regular bookings only }
        overbooked: { type: integer }
    AppProjectShift:
      type: object
      required: [id, date, end_date, start, end, break_minutes, description, craft, room, event, is_committed, required_count, assigned_count, workers, qualifications]
      properties:
        id: { type: integer }
        date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        start: { type: string }
        end: { type: string }
        break_minutes: { type: integer }
        description: { type: string, nullable: true }
        craft:
          anyOf: [{ $ref: '#/components/schemas/AppCraft' }]
          nullable: true
        room:
          anyOf: [{ $ref: '#/components/schemas/AppIdName' }]
          nullable: true
        event: { type: string, nullable: true, description: Event name }
        is_committed: { type: boolean }
        required_count: { type: integer }
        assigned_count: { type: integer }
        workers:
          type: array
          items: { $ref: '#/components/schemas/AppShiftWorker' }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/AppQualificationSlot' }
    AppShiftRequestBody:
      type: object
      required: [day, start, end, break_minutes, craft_id, qualifications]
      properties:
        day: { type: string, format: date }
        start: { type: string, example: '18:00' }
        end: { type: string, example: '23:00' }
        break_minutes: { type: integer, minimum: 0, maximum: 1440 }
        description: { type: string, nullable: true, maxLength: 1000 }
        craft_id: { type: integer }
        room_id:
          type: integer
          nullable: true
          description: Required for shifts without an event (always on create).
        qualifications:
          type: array
          items:
            type: object
            required: [shift_qualification_id, value]
            properties:
              shift_qualification_id: { type: integer }
              value: { type: integer, minimum: 0, maximum: 99 }
    AppShiftResponse:
      type: object
      required: [shift]
      properties:
        shift: { $ref: '#/components/schemas/AppProjectShift' }
    AppShiftShowResponse:
      type: object
      required: [shift, overbooking_allowed, crafts, rooms, shift_qualifications]
      properties:
        shift: { $ref: '#/components/schemas/AppProjectShift' }
        overbooking_allowed: { type: boolean }
        crafts:
          type: array
          items: { $ref: '#/components/schemas/AppCraft' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
        shift_qualifications:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
    AppWorkerOption:
      type: object
      required: [id, type, name]
      properties:
        id: { type: integer }
        type: { type: string, enum: [user, freelancer, service_provider] }
        name: { type: string }
    AppWorkersResponse:
      type: object
