    AppTaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/AppTask' }
    AppCandidatesResponse:
      type: object
      required: [users, has_more]
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/AppIdName' }
        has_more: { type: boolean }
    AppTeamRightsRequest:
      type: object
      properties:
        is_manager: { type: boolean }
